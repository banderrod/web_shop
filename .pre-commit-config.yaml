fail_fast: true
orphan: true

default_install_hook_types: [pre-commit, commit-msg, post-checkout, post-merge, post-rewrite]
default_stages: [pre-commit]

repos:
-   repo: local
    hooks:
      - id: unit-tests
        name: unit-tests
        entry: uv run pytest tests
        language: python
        pass_filenames: false
        priority: 50
      - id: audit
        name: packages-audit
        entry: uv audit
        language: python
        files: .lock
        pass_filenames: false
        priority: 0
-   repo: https://github.com/abravalheri/validate-pyproject
    rev: 4b2e70d08cb2ccd26d1fba73588de41c7a5d50b7  # frozen: v0.25
    hooks:
      - id: validate-pyproject
        priority: 40
-   repo: https://github.com/astral-sh/uv-pre-commit
    rev: 6e1b55a6dbea001ba7b914eae67df3c4bbd3ff6e  # frozen: 0.10.4
    hooks:
      - id: uv-lock
        priority: 0
      - id: uv-sync
        priority: 10
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
    -   id: check-docstring-first
        priority: 0
    -   id: end-of-file-fixer
        priority: 10
    -   id: trailing-whitespace
        priority: 20
-   repo: https://github.com/charliermarsh/ruff-pre-commit
    rev: 0839f92796ae388643a08a21640a029b322be5c2  # frozen: v0.15.2
    hooks:
      - id: ruff
        args: ["--fix"]
        priority: 40
      - id: ruff-format
        priority: 30
-   repo: https://github.com/commitizen-tools/commitizen
    rev: 7179a42b3544e953e3683a670056ad385892365d  # frozen: v4.13.8
    hooks:
      - id: commitizen
        stages: [commit-msg]
